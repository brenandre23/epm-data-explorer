name: EPM manifest refresh

# Keeps public/data/epm_manifest.json in step with the EPM repo, so page views read
# folder listings from it instead of GitHub's API. Each run asks every EPM branch in
# regions.json for its latest commit and re-reads only the branches that moved; an
# hour with nothing new commits nothing. See tools/build_epm_manifest.py.

on:
  schedule:
    - cron: '17 * * * *'   # hourly, off the top of the hour
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-read every branch'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: epm-manifest
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_epm_manifest.py ${{ inputs.full && '--full' || '' }}

      - name: Commit and push if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/epm_manifest.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "chore: refresh EPM manifest"
          git push

      - name: Open an issue if anything above failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Hourly: one open issue at a time, not one per failed run.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'automation-failure', per_page: 100,
            });
            if (open.some(i => i.title.startsWith('EPM manifest refresh failed'))) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `EPM manifest refresh failed — run #${context.runNumber}`,
              body: `The scheduled EPM manifest refresh failed. Pages fall back to GitHub's API until it runs again.\n\nRun log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation-failure']
            })
